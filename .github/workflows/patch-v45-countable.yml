name: Patch v45 countable servings

on:
  push:
    branches:
      - feature/v45-countable-servings
    paths:
      - .github/workflows/patch-v45-countable.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v45-countable-servings
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply governed countable-serving changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path)
              s=p.read_text()
              if s.count(old) < count:
                  raise SystemExit(f'{path}: expected patch anchor not found: {old[:80]!r}')
              s=s.replace(old,new,count)
              p.write_text(s)

          # 1. Extend the existing piece/amount contract. These are reference
          # weights, explicitly estimated, and can later be personally calibrated.
          replace('meal-data-contract-v1.js',
          """    mackerel:Object.freeze({half:90,whole:180})\n  });""",
          """    mackerel:Object.freeze({half:90,whole:180}),\n    egg:Object.freeze({egg:50}),\n    bread:Object.freeze({slice:40}),\n    sardines:Object.freeze({tin:100}),\n    tuna:Object.freeze({tin:120})\n  });""")

          # 2. Give the countable units human labels and make them first-class
          # discrete options rather than exposing their gram conversions as input.
          replace('piece-entry-v41.js',
          """    whole:'Whole',\n    half:'Half',\n    claw:'Claw'\n  });\n  const PIECE_KEY_PRIORITY=Object.freeze(['medium','piece','half','whole','small','large','claw']);""",
          """    whole:'Whole',\n    half:'Half',\n    claw:'Claw',\n    egg:'Egg',\n    slice:'Slice',\n    tin:'Tin'\n  });\n  const PIECE_KEY_PRIORITY=Object.freeze(['medium','piece','egg','slice','tin','half','whole','small','large','claw']);""")

          # 3. Make the shared sheet speak naturally for eggs, slices and tins.
          replace('piece-sheet-v41.js',
          """      whole:n===1?'whole piece':'whole pieces',\n      half:n===1?'half':'halves',\n      claw:n===1?'claw':'claws'\n    };""",
          """      whole:n===1?'whole piece':'whole pieces',\n      half:n===1?'half':'halves',\n      claw:n===1?'claw':'claws',\n      egg:n===1?'egg':'eggs',\n      slice:n===1?'slice':'slices',\n      tin:n===1?'tin':'tins'\n    };""")
          replace('piece-sheet-v41.js','aria-label="Piece size"','aria-label="Serving unit"')
          replace('piece-sheet-v41.js','aria-label="Piece count"','aria-label="Count"')
          replace('piece-sheet-v41.js','aria-label="Remove one piece"','aria-label="Remove one"')
          replace('piece-sheet-v41.js','aria-label="Add one piece"','aria-label="Add one"')
          replace('piece-sheet-v41.js','>Use pieces instead<','>Use count instead<')

          replace('quick-add-piece-v41.js',
                  "input.setAttribute('aria-label','Piece amount preview. Tap to choose pieces or grams.');",
                  "input.setAttribute('aria-label','Countable amount preview. Tap to choose count or grams.');")

          # 4. v45 cache/version cut. Same runtime set, new cache identity so the
          # modified governed modules cannot be stranded behind v44 URLs.
          p=Path('bootstrap-v14.js'); s=p.read_text(); s=s.replace("const VERSION = '44'","const VERSION = '45'").replace('?v=44','?v=45'); p.write_text(s)
          p=Path('service-worker.js'); s=p.read_text(); s=s.replace("const VERSION='44'","const VERSION='45'").replace("const CACHE='okello-food-v44'","const CACHE='okello-food-v45'").replace('?v=44','?v=45'); p.write_text(s)
          p=Path('index.html'); s=p.read_text().replace('styles.css?v=44','styles.css?v=45').replace('bootstrap-v14.js?v=44','bootstrap-v14.js?v=45'); p.write_text(s)
          p=Path('update-v1.js'); s=p.read_text().replace("const APP_VERSION = 'v44'","const APP_VERSION = 'v45'"); p.write_text(s)

          # 5. New focused regression executes the real contracts in a VM.
          Path('countable-servings-v45.test.js').write_text(r'''\
'use strict';

const fs=require('fs');
const vm=require('vm');
const assert=require('assert');

const store={};
const localStorage={
  getItem:key=>Object.prototype.hasOwnProperty.call(store,key)?store[key]:null,
  setItem:(key,value)=>{store[key]=String(value);}
};
const context={
  window:{},localStorage,console,
  crypto:{randomUUID:()=> 'test-log-id'}
};
context.globalThis=context;
vm.createContext(context);
vm.runInContext(fs.readFileSync('meal-data-contract-v1.js','utf8'),context);
vm.runInContext(fs.readFileSync('piece-entry-v41.js','utf8'),context);

const contract=context.window.OkelloMealDataContract;
const piece=context.window.OkelloPieceEntry;
assert.ok(contract,'meal data contract missing');
assert.ok(piece,'piece entry contract missing');

assert.equal(contract.pieceWeights.egg.egg,50,'egg reference should be 50 g edible weight');
assert.equal(contract.pieceWeights.bread.slice,40,'generic bread reference slice should be 40 g');
assert.equal(contract.pieceWeights.sardines.tin,100,'sardines reference tin should be 100 g drained');
assert.equal(contract.pieceWeights.tuna.tin,120,'tuna reference tin should be 120 g drained');

assert.equal(piece.optionsFor('egg',{})[0].label,'Egg');
assert.equal(piece.optionsFor('bread',{})[0].label,'Slice');
assert.equal(piece.optionsFor('sardines',{})[0].label,'Tin');

const eggs=piece.estimatePieces({},'egg','egg',3);
assert.equal(eggs.enteredAmount,3);
assert.equal(eggs.enteredUnit,'pieces');
assert.equal(eggs.pieceKey,'egg');
assert.equal(eggs.estimatedGrams,150);
assert.equal(eggs.amountQuality,'estimated');
assert.equal(eggs.estimateSource,'reference-piece-weight');

const bread=piece.estimatePieces({},'bread','slice',4);
assert.equal(bread.estimatedGrams,160);
const sardines=piece.estimatePieces({},'sardines','tin',1);
assert.equal(sardines.estimatedGrams,100);

const log=piece.createLogDraft({
  food:{id:'egg',name:'Boiled egg',emoji:'🥚',kcal:143,protein:12.6,fibre:0},
  amount:eggs,meal:'Lunch',source:'countable-serving-v45',ts:1,id:'egg-log'
});
assert.equal(log.pieceCount,3);
assert.equal(log.pieceKey,'egg');
assert.equal(log.estimatedGrams,150);
assert.equal(log.amountQuality,'estimated');
assert.equal(log.estimateSource,'reference-piece-weight');
assert.equal(log.kcal,214.5);
assert.equal(log.protein,18.9);

const sheet=fs.readFileSync('piece-sheet-v41.js','utf8');
for(const text of ["egg:n===1?'egg':'eggs'","slice:n===1?'slice':'slices'","tin:n===1?'tin':'tins'",'aria-label="Count"']){
  assert.ok(sheet.includes(text),`piece sheet missing ${text}`);
}

console.log('countable-servings-v45: PASS');
''')

          # 6. Bundle audit for the release cut.
          old=Path('bundle-v44.test.js').read_text()
          new=old.replace('v44','v45').replace("VERSION = '44'","VERSION = '45'").replace("VERSION='44'","VERSION='45'").replace("okello-food-v44","okello-food-v45").replace("APP_VERSION = 'v44'","APP_VERSION = 'v45'").replace('?v=44','?v=45').replace('bundle-v44: PASS','bundle-v45: PASS')
          # Some replacements above are intentionally redundant; assert final release text.
          new=new.replace("const APP_VERSION = 'v45'", "const APP_VERSION = 'v45'")
          Path('bundle-v45.test.js').write_text(new)

          # 7. Wire the release branch and focused checks into CI.
          p=Path('.github/workflows/plate-builder-v41.yml'); s=p.read_text()
          anchor='      - feature/v44-first-30-seconds\n'
          if '      - feature/v45-countable-servings\n' not in s:
              if anchor not in s: raise SystemExit('CI branch anchor missing')
              s=s.replace(anchor,anchor+'      - feature/v45-countable-servings\n',1)
          s=s.replace('      - name: Audit v44 bootstrap, service worker and update bundle\n        run: node bundle-v44.test.js\n',
                      '      - name: Run countable-serving contract checks\n        run: node countable-servings-v45.test.js\n      - name: Audit v45 bootstrap, service worker and update bundle\n        run: node bundle-v45.test.js\n')
          p.write_text(s)
          PY

          node --check meal-data-contract-v1.js
          node --check piece-entry-v41.js
          node --check piece-sheet-v41.js
          node --check quick-add-piece-v41.js
          node countable-servings-v45.test.js
          node bundle-v45.test.js
      - name: Commit v45 and remove one-shot workflow
        run: |
          rm .github/workflows/patch-v45-countable.yml
          git config user.name "okello12"
          git config user.email "56190257+okello12@users.noreply.github.com"
          git add meal-data-contract-v1.js piece-entry-v41.js piece-sheet-v41.js quick-add-piece-v41.js bootstrap-v14.js service-worker.js index.html update-v1.js countable-servings-v45.test.js bundle-v45.test.js .github/workflows/plate-builder-v41.yml .github/workflows/patch-v45-countable.yml
          git commit -m "Add countable eggs slices and tins in v45"
          git push origin HEAD:feature/v45-countable-servings
