name: Plate Builder v41 branch checks

on:
  push:
    branches:
      - feature/plate-builder-v41
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  migration-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run storage migration idempotence tests
        run: node storage-migration-v3.test.js
      - name: Run actual-phone-backup shape regression
        run: node live-backup-shape-v41.test.js
      - name: Run meal data contract tests
        run: node meal-data-contract-v1.test.js
      - name: Audit full shipped catalogue basis classifications
        run: node catalog-basis-audit-v1.test.js
      - name: Run piece-entry provenance and calibration tests
        run: node piece-entry-v41.test.js
      - name: Run direct piece-usual memory tests
        run: node piece-usual-v41.test.js
      - name: Run Smart Portion output contract tests
        run: node smart-portion-output-v41.test.js
      - name: Run piece-sheet state contract tests
        run: node piece-sheet-contract-v41.test.js
      - name: Run future-template recalculation tests
        run: node template-engine-v41.test.js
