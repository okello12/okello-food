name: Okello Food v44 branch checks

on:
  push:
    branches:
      - feature/plate-builder-v41
      - fix/v41-smart-meal-minimums
      - feature/v43-beta-feedback
      - feature/v44-first-30-seconds
      - fix/v44-1-static-shell
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  migration-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run storage migration idempotence tests
        run: node storage-migration-v3.test.js
      - name: Run actual-phone-backup shape regression
        run: node live-backup-shape-v41.test.js
      - name: Run smart-support alias and idempotence regression
        run: node smart-support-v41.test.js
      - name: Run meal data contract tests
        run: node meal-data-contract-v1.test.js
      - name: Audit full shipped catalogue basis classifications
        run: node catalog-basis-audit-v1.test.js
      - name: Run canonical catalog facade tests
        run: node meal-catalog-facade-v1.test.js
      - name: Run piece-entry provenance and calibration tests
        run: node piece-entry-v41.test.js
      - name: Run direct piece-usual memory tests
        run: node piece-usual-v41.test.js
      - name: Run Smart Portion output contract tests
        run: node smart-portion-output-v41.test.js
      - name: Run Smart Meal fit and fallback regression
        run: node smart-meal-fit-v41.test.js
      - name: Run governed Smart Meal runtime ownership checks
        run: node smart-meal-runtime-v41.test.js
      - name: Require Smart Meal runtime wiring
        run: node smart-meal-fit-wiring-v41.test.js
      - name: Run piece-sheet state contract tests
        run: node piece-sheet-contract-v41.test.js
      - name: Run piece-sheet rendering contract tests
        run: node piece-sheet-v41.test.js
      - name: Run delegated Quick Add piece routing tests
        run: node quick-add-piece-v41.test.js
      - name: Run legacy UI alias retirement checks
        run: node catalog-ui-v41.test.js
      - name: Run future-template recalculation tests
        run: node template-engine-v41.test.js
      - name: Run template runtime wiring tests
        run: node template-runtime-v41.test.js
      - name: Run local beta feedback contract checks
        run: node beta-feedback-v43.test.js
      - name: Run first-30-seconds UX contract checks
        run: node first-run-v44.test.js
      - name: Run static first-paint shell regression
        run: node static-shell-v44.test.js
      - name: Audit v44 bootstrap, service worker and update bundle
        run: node bundle-v44.test.js
      - name: Syntax-check governed runtime modules
        run: >-
          node --check meal-catalog-facade-v1.js &&
          node --check piece-entry-v41.js &&
          node --check piece-usual-v41.js &&
          node --check smart-portion-output-v41.js &&
          node --check smart-meal-fit-v41.js &&
          node --check smart-meal-guard-v42.js &&
          node --check smart-meal-runtime-v41.js &&
          node --check piece-sheet-contract-v41.js &&
          node --check piece-sheet-v41.js &&
          node --check quick-add-piece-v41.js &&
          node --check catalog-ui-v41.js &&
          node --check template-engine-v41.js &&
          node --check template-runtime-v41.js &&
          node --check beta-feedback-v43.js &&
          node --check first-run-v44.js
