name: Okello Food Pages artifact and public audit

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify-pages-artifact-and-public-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact pushed source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Locate the exact completed Pages run for this SHA
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=30"
          found=''

          for attempt in $(seq 1 36); do
            json=$(curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 1 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")

            row=$(jq -r --arg sha "$GITHUB_SHA" '
              .workflow_runs[]
              | select(.name == "pages build and deployment" and .head_sha == $sha)
              | [.id, .status, (.conclusion // "")]
              | @tsv
            ' <<<"$json" | head -n 1)

            if [ -z "$row" ]; then
              echo "Pages run for ${GITHUB_SHA} not visible yet (attempt ${attempt}/36)."
              sleep 5
              continue
            fi

            IFS=$'\t' read -r run_id status conclusion <<<"$row"
            echo "Pages run ${run_id}: status=${status} conclusion=${conclusion:-pending}"

            if [ "$status" = 'completed' ]; then
              if [ "$conclusion" != 'success' ]; then
                echo "Pages run ${run_id} completed with ${conclusion}, not success." >&2
                exit 1
              fi
              found="$run_id"
              break
            fi

            sleep 5
          done

          if [ -z "$found" ]; then
            echo "Timed out locating a successful Pages deployment for ${GITHUB_SHA}." >&2
            exit 1
          fi

          echo "run_id=$found" >> "$GITHUB_OUTPUT"
          echo "PAGES_RUN_ID=$found"
          echo "SOURCE_SHA=$GITHUB_SHA"

      - name: Download the exact Pages artifact from that run
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: pages-download
          github-token: ${{ github.token }}
          run-id: ${{ steps.pages.outputs.run_id }}

      - name: Unpack and verify the Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir pages-site
          tar -xf pages-download/artifact.tar -C pages-site

          build_id=$(sed -n 's/.*<meta name="okello-build-id" content="\([^"]*\)".*/\1/p' index.html | head -n1)
          bootstrap_src=$(sed -n 's/.*<script src="\(bootstrap-v14\.js[^"]*\)" defer><\/script>.*/\1/p' index.html | head -n1)
          [ -n "$build_id" ] || { echo 'Could not derive okello-build-id from source index.html' >&2; exit 1; }
          [ -n "$bootstrap_src" ] || { echo 'Could not derive bootstrap src from source index.html' >&2; exit 1; }

          required=(
            'What did you eat?'
            'Clear log'
            'BROWSE FOODS'
            "$bootstrap_src"
            "okello-build-id\" content=\"$build_id"
          )
          retired=(
            'Clear today'
            'WORLD FOOD LIBRARY'
          )

          for marker in "${required[@]}"; do
            grep -Fq "$marker" pages-site/index.html || { echo "Pages artifact missing required marker: $marker" >&2; exit 1; }
          done
          for marker in "${retired[@]}"; do
            ! grep -Fq "$marker" pages-site/index.html || { echo "Pages artifact contains retired marker: $marker" >&2; exit 1; }
          done

          cmp -s index.html pages-site/index.html || {
            echo 'Pages artifact index.html differs from source index.html' >&2
            sha256sum index.html pages-site/index.html
            exit 1
          }
          cmp -s app-v47-safe.html pages-site/app-v47-safe.html || {
            echo 'Pages artifact app-v47-safe.html differs from source safe entry' >&2
            sha256sum app-v47-safe.html pages-site/app-v47-safe.html
            exit 1
          }

          echo "BUILD_ID=$build_id" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_SRC=$bootstrap_src" >> "$GITHUB_ENV"
          sha256sum index.html pages-site/index.html app-v47-safe.html pages-site/app-v47-safe.html

      - name: Verify canonical, cache-busted and versioned public HTML
        shell: bash
        run: |
          set -euo pipefail
          base='https://okello12.github.io/okello-food/'
          build_marker="okello-build-id\" content=\"${BUILD_ID}"
          audit_token="${GITHUB_SHA}-${GITHUB_RUN_ID}"

          check_public() {
            local label="$1"
            local url="$2"
            local out="$3"
            local attempt
            for attempt in 1 2 3 4 5 6; do
              curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                "$url" -o "$out"
              if grep -Fq "$build_marker" "$out"; then
                echo "$label current on attempt $attempt"
                return 0
              fi
              echo "$label did not contain source-derived build marker on attempt $attempt" >&2
              sha256sum "$out" >&2 || true
              if [ "$attempt" -lt 6 ]; then sleep 10; fi
            done
            return 1
          }

          canonical_ok=0
          busted_ok=0
          index_ok=0
          safe_ok=0
          check_public canonical "$base" public-canonical.html || canonical_ok=$?
          check_public cache-busted "${base}?pages-audit=${audit_token}" public-busted.html || busted_ok=$?
          check_public explicit-index "${base}index.html?pages-audit=${audit_token}" public-index.html || index_ok=$?
          check_public safe-entry "${base}app-v47-safe.html?pages-audit=${audit_token}" public-safe.html || safe_ok=$?

          echo 'Public response SHA-256:'
          sha256sum public-canonical.html public-busted.html public-index.html public-safe.html pages-site/index.html pages-site/app-v47-safe.html

          if [ "$canonical_ok" -ne 0 ] && [ "$busted_ok" -eq 0 ]; then
            echo 'DIAGNOSIS: canonical Pages directory URL is stale while a cache-busted request is current.' >&2
            exit 1
          fi
          if [ "$canonical_ok" -ne 0 ] && [ "$index_ok" -eq 0 ] && [ "$safe_ok" -eq 0 ]; then
            echo 'DIAGNOSIS: bare directory representation is stale while explicit index and safe entry are current.' >&2
            exit 1
          fi
          if [ "$canonical_ok" -ne 0 ] || [ "$busted_ok" -ne 0 ] || [ "$index_ok" -ne 0 ] || [ "$safe_ok" -ne 0 ]; then
            echo 'DIAGNOSIS: one or more public Pages responses do not contain the deployed source-derived build marker.' >&2
            exit 1
          fi

          for file in public-canonical.html public-busted.html public-index.html public-safe.html; do
            for marker in 'What did you eat?' 'Clear log' 'BROWSE FOODS' "$BOOTSTRAP_SRC"; do
              grep -Fq "$marker" "$file" || { echo "$file missing required marker: $marker" >&2; exit 1; }
            done
            for marker in 'Clear today' 'WORLD FOOD LIBRARY'; do
              ! grep -Fq "$marker" "$file" || { echo "$file contains retired marker: $marker" >&2; exit 1; }
            done
          done

          cmp -s pages-site/index.html public-canonical.html || {
            echo 'Canonical public HTML contains the current marker but is not byte-identical to the deployed artifact.' >&2
            exit 1
          }
          cmp -s pages-site/index.html public-busted.html || {
            echo 'Cache-busted public HTML contains the current marker but is not byte-identical to the deployed artifact.' >&2
            exit 1
          }
          cmp -s pages-site/index.html public-index.html || {
            echo 'Explicit public index contains the current marker but is not byte-identical to the deployed artifact.' >&2
            exit 1
          }
          cmp -s pages-site/app-v47-safe.html public-safe.html || {
            echo 'Versioned safe entry is not byte-identical to the deployed safe-entry artifact.' >&2
            exit 1
          }

          echo 'PAGES_PUBLIC_AUDIT=PASS'
