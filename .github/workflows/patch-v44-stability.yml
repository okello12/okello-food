name: Patch v44 runtime stability

on:
  push:
    branches:
      - feature/v44-first-30-seconds
    paths:
      - .github/workflows/patch-v44-stability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v44-first-30-seconds
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch v44 runtime and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('first-run-v44.js')
          s=p.read_text()
          old="""      rows.forEach((row, index) => {
        qs('.v44-estimate-badge', row)?.remove();
        const label = estimateLabel(entries[index]);
        if(!label) return;
        const strong = qs('strong', row);
        if(!strong) return;
        const badge = document.createElement('span');
        badge.className = 'v44-estimate-badge';
        badge.textContent = label;
        strong.appendChild(badge);
      });"""
          new="""      rows.forEach((row, index) => {
        const existing = qs('.v44-estimate-badge', row);
        const label = estimateLabel(entries[index]);
        if(!label){ existing?.remove(); return; }
        if(existing){
          if(existing.textContent !== label) existing.textContent = label;
          return;
        }
        const strong = qs('strong', row);
        if(!strong) return;
        const badge = document.createElement('span');
        badge.className = 'v44-estimate-badge';
        badge.textContent = label;
        strong.appendChild(badge);
      });"""
          if old not in s:
              raise SystemExit('estimate badge block not found')
          s=s.replace(old,new,1)

          old2="""  $('foodSelect')?.addEventListener('change', () => setTimeout(refreshRoughControls, 0));
  window.addEventListener('okello:food-log-changed', () => {"""
          new2="""  $('foodSelect')?.addEventListener('change', () => setTimeout(refreshRoughControls, 0));
  $('gramsInput')?.addEventListener('input', event => {
    if(!event.isTrusted || !roughSelection) return;
    roughSelection = null;
    qsa('[data-rough]', $('v44Rough') || document).forEach(button => button.classList.remove('active'));
  });
  $('useSmartPortionBtn')?.addEventListener('click', () => {
    roughSelection = null;
    qsa('[data-rough]', $('v44Rough') || document).forEach(button => button.classList.remove('active'));
  }, true);
  window.addEventListener('okello:food-log-changed', () => {"""
          if old2 not in s:
              raise SystemExit('rough clear insertion point not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)

          t=Path('first-run-v44.test.js')
          q=t.read_text()
          anchor="assert.ok(src.includes('Estimated from pieces'),'piece estimate badge missing');\n"
          extra="""assert.ok(src.includes("const existing = qs('.v44-estimate-badge', row)"),'estimate badges must update in place rather than mutation-loop');
assert.ok(src.includes("if(existing.textContent !== label) existing.textContent = label"),'stable estimate badge update guard missing');
assert.ok(src.includes("if(!event.isTrusted || !roughSelection) return"),'manual gram edits must cancel rough-serving provenance');
assert.ok(src.includes("$('useSmartPortionBtn')?.addEventListener('click'"),'Smart Portion must cancel any prior rough-serving selection');
"""
          if anchor not in q:
              raise SystemExit('test anchor not found')
          q=q.replace(anchor,anchor+extra,1)
          t.write_text(q)
          PY
          node --check first-run-v44.js
          node first-run-v44.test.js
      - name: Remove one-shot workflow and commit patch
        run: |
          rm .github/workflows/patch-v44-stability.yml
          git config user.name "okello12"
          git config user.email "56190257+okello12@users.noreply.github.com"
          git add first-run-v44.js first-run-v44.test.js .github/workflows/patch-v44-stability.yml
          git commit -m "Stabilize v44 estimate badges and rough entry provenance"
          git push origin HEAD:feature/v44-first-30-seconds
