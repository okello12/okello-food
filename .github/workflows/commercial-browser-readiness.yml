name: Commercial browser readiness
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build allowlisted static application
        run: node scripts/build-commercial-static.cjs
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Verify cross-origin backup and privacy controls
        run: node scripts/cross-origin-browser-test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: commercial-static-preview
          path: dist/
