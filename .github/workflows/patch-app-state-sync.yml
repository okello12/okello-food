name: One-shot app state sync patch

on:
  push:
    branches:
      - fix/v41-smart-meal-minimums

permissions:
  contents: write

jobs:
  patch-app-state:
    if: ${{ !contains(github.event.head_commit.message, '[state-sync-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/v41-smart-meal-minimums
          fetch-depth: 0
      - name: Insert explicit app state synchronization hook
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='app.js';
          let src=fs.readFileSync(file,'utf8');
          if(src.includes('window.OkelloAppState')) process.exit(0);
          const anchor="  initTabs(); bindEvents(); initAll();";
          if(!src.includes(anchor)) throw new Error('app.js init anchor not found');
          const hook=`  function syncFromStorage(){\n    state=loadState();\n    initAll();\n    return true;\n  }\n\n  window.OkelloAppState=Object.freeze({\n    syncFromStorage,\n    getState:()=>state\n  });\n\n`;
          src=src.replace(anchor,hook+anchor);
          fs.writeFileSync(file,src);
          NODE
      - name: Commit state sync hook
        run: |
          if git diff --quiet -- app.js; then exit 0; fi
          git config user.name "okello12"
          git config user.email "56190257+okello12@users.noreply.github.com"
          git add app.js
          git commit -m "[state-sync-patched] Expose app state synchronization hook"
          git push origin HEAD:fix/v41-smart-meal-minimums
